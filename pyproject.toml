[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "itdd-control-plane"
version = "0.1.0"
description = "Intent-Driven Development with Independent Verification"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "ITDD Contributors"}
]
keywords = [
    "intent-driven",
    "ai-assisted",
    "software-engineering",
    "verification",
    "test-driven"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pytest>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/itdd-control-plane/itdd-control-plane"
Documentation = "https://github.com/itdd-control-plane/itdd-control-plane/blob/main/docs/agents/itdd-in-prime-usage.md"
Repository = "https://github.com/itdd-control-plane/itdd-control-plane"
Issues = "https://github.com/itdd-control-plane/itdd-control-plane/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["control*", "skills*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I"]
